services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: broker-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP port
      - "15672:15672"   # RabbitMQ Web UI
    networks:
      - kora_dev_network

  redis:
    image: redis:alpine
    container_name: broker-redis
    restart: unless-stopped
    ports:
      - "6379:6379"     # Redis port
    networks:
      - kora_dev_network

networks:
  kora_dev_network:
    name: kora_dev_network