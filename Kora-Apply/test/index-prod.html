<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDK Test</title>

    <script>
        console.log("📜 Loading kora-apply.js from CloudFront...");
    </script>

    <script src="https://sdk.hirekora.com/kora-apply.js" defer></script>

</head>
<body>
    <h1>SDK Test Page</h1>
    <div id="apply-container"></div>

    <script>
        window.onload = function () {
            console.log("✅ DOM fully loaded!");

            console.log("✅ kora-apply.js script loaded!");
            console.log("🔍 typeof window.KoraApplyWidget (before wait):", typeof window.KoraApplyWidget);
            console.log("🔍 window.KoraApplyWidget value:", window.KoraApplyWidget);
            console.log("🔍 window.KoraApplyWidget.default:", window.KoraApplyWidget?.default);
            console.log("🔍 window.KoraApplyWidget.default.init:", window.KoraApplyWidget?.default?.init);
            console.log("🔍 window.KoraApplyWidget.KoraApplyWidget:", window.KoraApplyWidget?.KoraApplyWidget);
            console.log("🔍 window.KoraApplyWidget.KoraApplyWidget.init:", window.KoraApplyWidget?.KoraApplyWidget?.init);

            function waitForWidget(attempt = 1) {
                console.log(`🔍 Attempt ${attempt}: Checking window.KoraApplyWidget...`, window.KoraApplyWidget);

                if (window.KoraApplyWidget && typeof window.KoraApplyWidget.init === "function") {
                    console.log("✅ KoraApplyWidget loaded successfully!");
                    console.log("🔍 Final window.KoraApplyWidget:", window.KoraApplyWidget);
                    console.log("✅ Calling window.KoraApplyWidget.init...");

                    if (typeof window.KoraApplyWidget.init !== "function") {
                        console.error("❌ window.KoraApplyWidget.init is NOT a function!");
                    } else {
                        console.log("✅ Calling window.KoraApplyWidget.init...");
                        window.KoraApplyWidget.init("apply-container", {
                            jobID: '6b791835-8213-46a4-a77c-ea970c71dd30',
                            publicKey: 'MIIBJzAOBgrphmKx7w1TAxEFABOCVQ9AMHIEBgLCARBmz4tQpW8YkS1vN0h2ePXKQf4dSaJrT2yXq3b9GZ7mCL0pYe8DMkVrPu1HQswNbK5RfTqMe3LhD9gKxWc2BzQY'
                        });
                    }
                } else {
                    console.warn(`⏳ Attempt ${attempt}: Waiting for KoraApplyWidget...`);
                    setTimeout(() => waitForWidget(attempt + 1), 500);
                }
            }

            waitForWidget();
        };
    </script>
</body>
</html>
